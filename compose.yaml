services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-adapter}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}"
      POSTGRES_DB: "${POSTGRES_DB:-ai_adapter}"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      target: api
    image: ai-adapter-api:local
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      API_PREFIX: /api/v1
      CORS_ORIGINS: "http://localhost:8501,http://127.0.0.1:8501"
      DEFAULT_PROVIDER: fake
      MODEL_VERSION_MANIFEST: config/model_versions.json
      DATABASE_ENABLED: "true"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-adapter}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.docker}@db:5432/${POSTGRES_DB:-ai_adapter}"
      DATABASE_AUTO_CREATE: "false"
      DATABASE_ECHO: "false"
      SECURITY_REQUIRE_AUTH: "true"
      SECURITY_API_KEYS: "${SECURITY_API_KEYS:?SECURITY_API_KEYS must be set in .env.docker}"
      SECURITY_ADMIN_API_KEYS: "${SECURITY_ADMIN_API_KEYS:?SECURITY_ADMIN_API_KEYS must be set in .env.docker}"
      RELIABILITY_FALLBACK_PROVIDER: fake
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  dashboard:
    build:
      context: .
      target: dashboard
    image: ai-adapter-dashboard:local
    restart: unless-stopped
    environment:
      HOME: /tmp
      DASHBOARD_API_BASE_URL: http://api:8000
      DASHBOARD_API_PREFIX: /api/v1
      DASHBOARD_ADMIN_API_KEY: "${SECURITY_ADMIN_API_KEYS:?SECURITY_ADMIN_API_KEYS must be set in .env.docker}"
      DASHBOARD_REQUEST_TIMEOUT_SECONDS: "15"
      DASHBOARD_TRUST_ENV: "false"
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  db_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
