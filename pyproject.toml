[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-adapter"
version = "0.1.0"
description = "Provider-independent, reliability-first AI adapter service."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "aiosqlite>=0.20,<1.0",
    "asyncpg>=0.30,<1.0",
    "prometheus-client>=0.21,<1.0",
    "streamlit>=1.50,<2.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16,<3.0",
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.17,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "dashboard*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
    "fault_matrix: deterministic Stage H provider and request fault-injection matrix",
    "regression: deterministic Stage I contract baselines and model-version checks",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests", "scripts", "alembic"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI query parameters intentionally use Query() calls in signatures.
"app/api/routes/*.py" = ["B008"]
